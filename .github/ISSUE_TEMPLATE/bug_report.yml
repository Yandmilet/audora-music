name: 缺陷报告 (Bug)
description: 报告 Audora 的问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 感谢反馈。个人自用项目，越具体越快修。
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么？
      description: 期望行为 vs 实际行为
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开「我的」
        2. 点击「批量匹配音源」
        3. ……
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: 涉及模块
      options:
        - 播放（含后台播放 / 通知栏）
        - 音源匹配
        - 搜索 / 导入
        - 收藏 / 播放统计
        - 歌词
        - 数据库 / 迁移
        - UI 其他
        - 构建 / 工程化
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 报错信息
      render: shell
