name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Install SQLite (system sqlite3 for sqflite_common_ffi)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test
        # 真机联网冒烟测试（integration_test/live_smoke_test.dart）不在 CI 执行，
        # `flutter test` 默认只跑 test/ 目录。
