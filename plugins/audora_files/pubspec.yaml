name: audora_files
description: Audora 的 Android 存储能力：SAF 目录选择与持久化授权、MediaStore 音频扫描、下载落盘。只为 audora_music 服务，不发布。
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.13.4 <4.0.0'
  flutter: '>=3.47.5 <3.48.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.fly1pu.audora_files
        pluginClass: AudoraFilesPlugin
