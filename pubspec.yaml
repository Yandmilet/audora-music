name: audora_music
description: Audora v0.1.0 —— 个人自用音乐播放器（元数据来自 QQ音乐，音源来自 B站）
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.13.4 <4.0.0'
  flutter: '>=3.47.5 <3.48.0'

dependencies:
  flutter:
    sdk: flutter

  # 本地数据库（歌曲 / 收藏 / 音源映射）
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4

  # 轻量设置持久化（音质偏好等），与数据库分开——
  # 这些是「本机偏好」不是曲库数据，不该混进 audora.db 影响备份/清理
  shared_preferences: ^2.3.2

  # 网络（QQ音乐元数据 + B站音源）
  dio: ^5.7.0

  # Wbi 签名所需的 MD5
  crypto: ^3.0.6

  # 音频播放（Media3 / ExoPlayer 后端）
  just_audio: ^0.10.6

  # 后台播放 + 通知栏 / 锁屏媒体控制（MediaSession）
  audio_service: ^0.18.19
  permission_handler: ^13.0.2
  qr_flutter: ^4.1.0

  # 图片磁盘缓存（歌单封面 / 歌手头像 / 封面墙）
  cached_network_image: ^4.0.4

  # 本地存储能力（SAF 目录选择与持久化授权 / MediaStore 扫描 / 下载落盘）。
  # 仓库内的 Android 插件，见 plugins/audora_files/——放插件而不是塞
  # android/app，是因为宿主 Activity 必须是 audio_service 的那个（原因写在
  # AndroidManifest.xml 注释里），不能为了加一个通道再去动它。
  audora_files:
    path: plugins/audora_files

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # 真机集成测试（integration_test/live_smoke_test.dart，需要真机 + 网络）
  integration_test:
    sdk: flutter
  # 单测里用 sqlite3 的内存库跑 DAO（真机走 sqflite 原生实现，不用这个包）
  sqflite_common_ffi: ^2.4.3
  # tool/eval_match_samples.dart 直读导出的 audora.db（Windows 走系统 winsqlite3.dll）
  sqlite3: ^3.6.0
hooks:
  user_defines:
    sqlite3:
      source: system
      name:
        # Windows 的系统 SQLite 叫 winsqlite3.dll（位于 System32）
        windows: winsqlite3
        # Android / 其他平台用默认名（libsqlite3.so）
        default: sqlite3

flutter:
  uses-material-design: true
