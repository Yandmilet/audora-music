# Gradle Global Config —— 规范副本（canonical）
# 实际生效位置: %GRADLE_USER_HOME%\gradle.properties  (本机 = C:\FlutterDev\caches\gradle)
# 本文件是仓库内的权威镜像，用于在新机器上复现同一套全局构建配置。
# 部署方式: 复制到目标机器的 %GRADLE_USER_HOME%\gradle.properties。
# 关联清单: docs/toolchain-lock.md
#
# 2026-10-11: 关闭 configuration cache —— Flutter 3.47.x 的 Gradle build-logic
# (addFlutterTasks 捕获 ApkVariantOutputImpl、DependencyVersionChecker) 与 AGP 9
# 强制的配置缓存不兼容，强开会让 flutter build/run 在序列化阶段崩溃。
# 纯 Gradle/Android 项目需要时，用命令行 --configuration-cache 单独开启。

# JVM memory for the Gradle daemon
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Performance
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.caching=true
# org.gradle.configuration-cache=true   # 故意关闭，见上

# Android
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
